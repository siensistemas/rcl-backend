version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: rcl_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rcl_db
      POSTGRES_USER: rcl_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=es_CO.UTF-8'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rcl_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcl_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rcl_redis
    restart: unless-stopped
    networks:
      - rcl_network

  backend:
    build: .
    container_name: rcl_backend
    restart: unless-stopped
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    environment:
      - RUN_INIT=1
    volumes:
      - ./static:/app/static
      - ./media:/app/media
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - rcl_network

  celery:
    build: .
    container_name: rcl_celery
    restart: unless-stopped
    command: celery -A core worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - rcl_network

  celery-beat:
    build: .
    container_name: rcl_celery_beat
    restart: unless-stopped
    command: celery -A core beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - rcl_network

volumes:
  postgres_data:

networks:
  rcl_network:
    driver: bridge
