version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: busca_me_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: busca_me_db
      POSTGRES_USER: busca_me_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=es_CO.UTF-8'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - busca_me_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U busca_me_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: busca_me_redis
    restart: unless-stopped
    networks:
      - busca_me_network

  backend:
    build: .
    container_name: busca_me_backend
    restart: unless-stopped
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    environment:
      - RUN_INIT=1
    volumes:
      - ./static:/app/static
      - ./media:/app/media
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - busca_me_network

  celery:
    build: .
    container_name: busca_me_celery
    restart: unless-stopped
    command: celery -A core worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - busca_me_network

  celery-beat:
    build: .
    container_name: busca_me_celery_beat
    restart: unless-stopped
    command: celery -A core beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - busca_me_network

volumes:
  postgres_data:

networks:
  busca_me_network:
    driver: bridge