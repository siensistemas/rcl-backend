# Servidor virtual creado por Let's Encrypt / certificado
server {
    listen 80;
    server_name www.siensistemas.com siensistemas.com;

    # Redirigir a HTTPS (si Cloudflare no maneja SSL en origin, usamos 443)
    return 301 https://www.siensistemas.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.siensistemas.com siensistemas.com;

    # Certificados (ajustar rutas a tus certificados / certbot)
    ssl_certificate     /etc/letsencrypt/live/www.siensistemas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.siensistemas.com/privkey.pem;

    # Backend RCL servido bajo /rcl/
    location /rcl/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }

    # Estaticos seriales del backend (accede al volumen /opt/rcl-backend/static)
    location /rcl/static/ {
        alias /opt/rcl-backend/static/;
        gzip on;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Archivos subidos (accede al volumen /opt/rcl-backend/media)
    location /rcl/media/ {
        alias /opt/rcl-backend/media/;
    }

    # Siempre redirigir siensistemas.com -> www (evitar duplicacion)
    if ($host = 'siensistemas.com') {
        return 301 https://www.siensistemas.com$request_uri;
    }
}
